<lib-header></lib-header>

<div class="container mt-5">
    <div class="row">
        <div class="c-title">
            <h1>Cadastre-se</h1>
            <div class="line"></div>
        </div>
        <div class="c-subtitle">
            <p>Crie sua conta e comece a transformar suas tarefas em conquista!</p>
        </div>
    </div>
    <div class="c-form">
        <form class="form">
            <div class="row">
            <div class="form-group">
                <label for="email">Nome:</label>
                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
                </div>
            </div>
            <div class="row">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="password">Confirmar senha:</label>
                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
                </div>
            </div>
            <div class="row">
                <div class="c-link">
                    <button type="submit" class="btn">Concluir</button>
                </div>
            </div>
        </form>
        <div class="c-footer">
            <p>Já tem uma conta?<a routerLink="/signIn" class="c-link"> <span class="c-link__details"> Login</span></a></p>
        </div>
    </div>
</div>
